<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Defence in depth: even if note content ever reached the page as HTML, it can't run script or call out. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f4ef" />
  <title>Inkpad</title>
  <link rel="icon" href="icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <script src="src/theme.js"></script>
</head>
<body>
  <div id="app"></div>
  <script src="vendor/capacitor/capacitor.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
